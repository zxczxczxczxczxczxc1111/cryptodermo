[package]
name = "cryptodermo"
version = "1.0.0"
description = "Личное зашифрованное офлайн-хранилище записей"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# Суффикс `_lib` не для красоты: без него имя библиотеки совпадает с именем
# бинарника, а на Windows это конфликт при сборке (см.
# https://github.com/rust-lang/cargo/issues/8519).
name = "cryptodermo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
# thiserror убирает ручное написание `impl std::error::Error` и `Display`
# для VaultFsError - используется по образцу из документации Tauri v2 для
# ошибок команд (https://v2.tauri.app/develop/calling-rust/#error-handling).
thiserror = "2"

